[advisories]
# RUSTSEC-2024-0436: `paste` is no longer maintained; it is a transitive
# dependency of `ratatui` (via reeve-tui) and has no safe upgrade path.
# The crate is used only for proc-macro identifier generation, has no
# exploitable attack surface, and the advisory notes this as a
# maintenance concern rather than a security vulnerability.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # webpki-roots (via reqwest → hyper-rustls → rustls) ships Mozilla's root
  # certificate bundle. CDLA-Permissive-2.0 is a permissive data license; it
  # imposes no distribution or patent restrictions on software use.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

# The Linux-only `secret-service` crate (used by reeve-runtime keychain
# integration on `cfg(all(unix, not(target_os = "macos")))`) pulls in the
# `zbus` D-Bus stack. zbus's proc-macro chain depends on a newer
# `toml`/`winnow` than our direct `toml` dependency, and zbus's
# `uds_windows` transitive pulls `tempfile` with default features, which
# re-enables `getrandom` and the `wasip2`/`wasip3` `wit-bindgen` chain.
#
# These duplicates are not reachable from any code path we control: they
# are mutual-exclusion mismatches between independent transitive trees.
# Each entry below is a known-tolerated duplicate, scoped narrowly. If a
# duplicate falls out of the lock (e.g., zbus updates to align with the
# `toml` ecosystem), the corresponding entry should be removed.
skip = [
  # tempfile (default-features re-enabled by zbus -> uds_windows) ->
  # wasip2/wasip3 -> getrandom 0.4. Our direct rand_core takes
  # getrandom 0.2.
  { name = "getrandom", version = "=0.2.17" },
  { name = "getrandom", version = "=0.4.2" },
  # zbus_macros / zvariant_derive -> proc-macro-crate -> toml_edit 0.25.
  # Our `toml` crate uses 0.22.
  { name = "toml_datetime", version = "=0.6.11" },
  { name = "toml_datetime", version = "=1.1.1+spec-1.1.0" },
  { name = "toml_edit", version = "=0.22.27" },
  { name = "toml_edit", version = "=0.25.11+spec-1.1.0" },
  # Each toml_edit version vendors its own pinned winnow: toml_edit 0.22
  # (used by our direct `toml` dependency) pins winnow 0.7, while
  # toml_edit 0.25 (used by zbus's proc-macro-crate transitive dep) pins
  # winnow 1.0. Sharing a single winnow version requires coordinated
  # toml_edit upgrades we don't control.
  { name = "winnow", version = "=0.7.15" },
  { name = "winnow", version = "=1.0.2" },
  # wasip2 (=0.57) and wasip3 (=0.51) are separately-generated wit-target
  # crates, each pinning the wit-bindgen version that was current when they
  # were emitted. Sharing a single wit-bindgen version requires coordinated
  # regeneration of both crates, which is outside our control.
  { name = "wit-bindgen", version = "=0.51.0" },
  { name = "wit-bindgen", version = "=0.57.1" },
  # notify 8.x directly depends on windows-sys 0.60; mio 1.x (also a notify
  # dep) uses windows-sys 0.61. Both are vendored by their respective
  # consumers and the version gap is not within our control.
  { name = "windows-sys", version = "=0.60.2" },
  { name = "windows-sys", version = "=0.61.2" },
  # reqwest → rustls → ring uses windows-sys 0.52 (via its own windows-targets
  # 0.52 tree). The notify/mio tree uses windows-sys 0.60/0.61 which pulls
  # windows-targets 0.53. The two windows-sys trees vendor disjoint
  # windows-targets sub-crates and cannot be unified without coordinated
  # upstream upgrades.
  { name = "windows-sys", version = "=0.52.0" },
  { name = "windows-targets", version = "=0.52.6" },
  { name = "windows-targets", version = "=0.53.5" },
  { name = "windows_aarch64_gnullvm", version = "=0.52.6" },
  { name = "windows_aarch64_gnullvm", version = "=0.53.1" },
  { name = "windows_aarch64_msvc", version = "=0.52.6" },
  { name = "windows_aarch64_msvc", version = "=0.53.1" },
  { name = "windows_i686_gnu", version = "=0.52.6" },
  { name = "windows_i686_gnu", version = "=0.53.1" },
  { name = "windows_i686_gnullvm", version = "=0.52.6" },
  { name = "windows_i686_gnullvm", version = "=0.53.1" },
  { name = "windows_i686_msvc", version = "=0.52.6" },
  { name = "windows_i686_msvc", version = "=0.53.1" },
  { name = "windows_x86_64_gnu", version = "=0.52.6" },
  { name = "windows_x86_64_gnu", version = "=0.53.1" },
  { name = "windows_x86_64_gnullvm", version = "=0.52.6" },
  { name = "windows_x86_64_gnullvm", version = "=0.53.1" },
  { name = "windows_x86_64_msvc", version = "=0.52.6" },
  { name = "windows_x86_64_msvc", version = "=0.53.1" },
  # ratatui 0.30.x (via reeve-tui) pulls in hashbrown 0.15.x and 0.16.x;
  # indexmap (a transitive dep) pins 0.17.x. All three are ABI-compatible;
  # unifying requires upstream coordination outside our control.
  { name = "hashbrown", version = "=0.15.5" },
  { name = "hashbrown", version = "=0.16.1" },
  { name = "hashbrown", version = "=0.17.1" },
  # async-trait 0.1.90 (and clap derive) moved to syn 3.x; thiserror-impl
  # and async-recursion still pin syn 2.x. Sharing one version requires a
  # coordinated proc-macro migration we don't control.
  { name = "syn", version = "=2.0.117" },
  { name = "syn", version = "=3.0.3" },
  # ratatui (via reeve-tui) pins unicode-width 0.2.x; other crates in the
  # workspace use unicode-width 0.1.x. Unifying requires upstream updates.
  { name = "unicode-width", version = "=0.1.14" },
  { name = "unicode-width", version = "=0.2.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
