[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ericbmerritt/reeve"
homepage = "https://github.com/ericbmerritt/reeve"
authors = ["Eric Merritt <eric@merritt.tech>"]
publish = false

[workspace.dependencies]
actix = { version = "0.13", default-features = false }
async-trait = { version = "0.1" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
secrecy = { version = "0.10" }
ratatui = { version = "0.30" }
crossterm = { version = "0.29", features = ["event-stream"] }

tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

base64 = { version = "0.22", default-features = false, features = ["std"] }
notify = { version = "8" }
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "std", "zeroize", "rand_core"] }
libc = { version = "0.2", default-features = false }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
security-framework = { version = "3", default-features = false }
secret-service = { version = "5", default-features = false, features = ["rt-tokio-crypto-rust"] }
tempfile = { version = "3", default-features = false }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde", "std"] }
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

reeve-types = { version = "0.1.0", path = "crates/reeve-types" }
reeve-transport = { version = "0.1.0", path = "crates/reeve-transport" }
reeve-adapter = { version = "0.1.0", path = "crates/reeve-adapter" }
reeve-runtime = { version = "0.1.0", path = "crates/reeve-runtime" }
reeve-tui = { version = "0.1.0", path = "crates/reeve-tui" }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
must_use_candidate = "allow"
default_trait_access = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
cast_precision_loss = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
map_unwrap_or = "allow"
# Allowed because KeychainError carries platform-specific source enums
# (secret_service::Error on Linux is large). The error types are returned
# from CLI dispatch paths, not hot loops. If we ever care, box the
# Keychain variant of EnrollError / UnenrollError (follow-on).
result_large_err = "allow"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
exit = "deny"
create_dir = "deny"
undocumented_unsafe_blocks = "deny"
unused_result_ok = "deny"
as_conversions = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
str_to_string = "deny"
wildcard_enum_match_arm = "deny"
todo = "deny"
unimplemented = "deny"
use_self = "deny"
float_cmp = "deny"

too_many_arguments = "deny"
too_many_lines = "deny"
excessive_nesting = "deny"

needless_borrows_for_generic_args = "deny"
or_fun_call = "deny"
redundant_pub_crate = "allow"
empty_line_after_doc_comments = "deny"
manual_clamp = "deny"

box_default = "deny"
format_in_format_args = "deny"
wildcard_dependencies = "deny"

self_named_module_files = { level = "allow", priority = 1 }
mod_module_files = { level = "deny", priority = 1 }

[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unreachable_pub = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
