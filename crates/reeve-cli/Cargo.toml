[package]
name = "reeve-cli"
description = "Reeve CLI: the `reeve` binary entry point that dispatches subcommands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "reeve"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
reeve-runtime = { workspace = true }
reeve-tui = { workspace = true }
reeve-types = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
zeroize = { workspace = true }
