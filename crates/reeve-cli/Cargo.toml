[package]
name = "reeve-cli"
description = "Reeve CLI: the `reeve` binary entry point that dispatches subcommands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "reeve"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
rand_core = { workspace = true }
reeve-adapter = { workspace = true }
reeve-runtime = { workspace = true }
reeve-transport = { workspace = true }
reeve-types = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
time = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
zeroize = { workspace = true }
